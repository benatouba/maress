stages:
  - lint
  - test
  - build
  - validate

# ── Caches ──────────────────────────────────────────────────
.backend-cache: &backend-cache
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.venv/

.frontend-cache: &frontend-cache
  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/

# ── Backend ─────────────────────────────────────────────────
backend-lint:
  stage: lint
  image: python:3.12-slim
  <<: *backend-cache
  before_script:
    - pip install uv
    - cd backend
    - uv sync --frozen
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy .

backend-test:
  stage: test
  image: python:3.12-slim
  <<: *backend-cache
  services:
    - name: postgis/postgis:15-3.3
      alias: db
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: maress_test
    POSTGRES_USER: maress
    POSTGRES_PASSWORD: maress_test
    POSTGRES_SERVER: db
    POSTGRES_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
  before_script:
    - pip install uv
    - cd backend
    - uv sync --frozen
  script:
    - uv run pytest --cov --cov-fail-under=60 -x -q

# ── Frontend ────────────────────────────────────────────────
frontend-lint:
  stage: lint
  image: node:22-alpine
  <<: *frontend-cache
  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
    - pnpm type-check
    - pnpm format:check

frontend-test:
  stage: test
  image: node:22-alpine
  <<: *frontend-cache
  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile
  script:
    - pnpm test -- --run

frontend-build:
  stage: build
  image: node:22-alpine
  <<: *frontend-cache
  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
  only:
    - main
    - merge_requests

# ── NFDI4Earth metadata validation (existing) ───────────────
validate-nfdi4earth-metadata:
  stage: validate
  image: python:3.8-buster
  script: |-
    if test -f CITATION.cff; then
        python3 -m pip install --user cffconvert
        export PATH="$PATH:$HOME/.local/bin/"
        cffconvert --validate -i CITATION.cff
    fi

    git clone -b dev https://git.rwth-aachen.de/nfdi4earth/knowledgehub/kh-populator.git &&
    pip install -e kh-populator &&
    pip install --extra-index-url https://git.rwth-aachen.de/api/v4/projects/85620/packages/pypi/simple nfdi4earth-kh-schema &&
    python -c "
    from kh_populator.pipelines.harvest_incub_and_pilots import harvest_individual_research_project
    harvest_individual_research_project($CI_PROJECT_ID, 'temp', 'temp')"
  only:
    - main
