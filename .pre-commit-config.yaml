repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd frontend && npx oxlint .'
        language: system
        files: ^frontend/src/.*\.(ts|vue|js)$
        pass_filenames: false

      - id: frontend-format
        name: frontend format check
        entry: bash -c 'cd frontend && npx oxfmt --check .'
        language: system
        files: ^frontend/src/.*\.(ts|vue|js)$
        pass_filenames: false
